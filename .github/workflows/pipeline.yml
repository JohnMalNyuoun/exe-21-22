name: Deployment pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

jobs:
  backend_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci
      - name: Run backend tests
        working-directory: Backend
        run: npm test

  frontend_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bloglist-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: bloglist-frontend
        run: npm ci
      - name: Lint frontend
        working-directory: bloglist-frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: bloglist-frontend
        run: npm test
      - name: Build frontend
        working-directory: bloglist-frontend
        run: npm run build

  build_and_test:
    needs: [backend_test, frontend_test]
    runs-on: ubuntu-latest
    steps:
      - name: Validation complete
        run: echo "Backend and frontend checks passed"

  deploy:
    if: ${{ github.event_name == 'push' && !contains(toJson(github.event.commits), '#skip') }}
    needs: [build_and_test]
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger deployment
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 "$RENDER_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK is not set, skipping deployment trigger."
          fi

  notify_success:
    needs: [deploy]
    if: ${{ github.event_name == 'push' && !contains(toJson(github.event.commits), '#skip') }}
    runs-on: ubuntu-latest
    env:
      DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Notify Deployment Success
        run: |
          if [ -z "$DISCORD_URL" ]; then
            echo "Warning: DISCORD_WEBHOOK secret is missing or empty on GitHub Settings. Skipping Discord notification."
            exit 0
          fi
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content": "Successfully deployed custom pipeline app to Render!"}' \
            "$DISCORD_URL"

  notify_failure:
    needs: [backend_test, frontend_test, build_and_test, deploy]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Notify Build Failure
        run: |
          if [ -n "$DISCORD_URL" ]; then
            curl -H "Content-Type: application/json" \
              -X POST \
              -d "{\"content\": \"Pipeline failed! Commit: ${{ github.sha }} by ${{ github.actor }}\"}" \
              "$DISCORD_URL"
          else
            echo "DISCORD_WEBHOOK secret is missing. Skipping failure notification."
          fi

  tag_release:
    if: ${{ github.event_name == 'push' && !contains(toJson(github.event.commits), '#skip') }}
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch